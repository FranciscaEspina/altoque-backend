spring.application.name=altoque-backend
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/altoque
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=${JWT_SECRET:cambia-este-secreto-por-uno-largo-y-aleatorio-de-32-caracteres-o-mas}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-days=7

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://18.205.24.240:5173}

springdoc.swagger-ui.path=/swagger-ui.html
